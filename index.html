<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Молочный Мир: план доставки</title>
<!-- Библиотеки и шрифты лежат в папке vendor/ (решение 12): показ не зависит от чужих серверов. Версии и лицензии — в README.md. -->
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=36">
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Молочный Мир</h1>
      <p id="meta">План доставки по Гродно</p>
    </div>
  </div>
  <!-- Настоящие дата и время (часы компьютера). Время в маршрутах — по плану: показ днём, маршруты утренние. -->
  <div class="now" aria-live="off"><b id="now-time">--:--</b><span id="now-date"></span></div>
  <div class="top-actions">
    <span id="conn" class="pill">Подключаюсь…</span>
    <span id="approval" class="pill warn">План не утверждён</span>
    <div class="seg" role="group" aria-label="Какой план показывать">
      <button type="button" id="view-best" class="on">Сегодня</button>
      <button type="button" id="view-tomorrow" title="Обычный день: вес заказов на 30% меньше">Завтра</button>
      <button type="button" id="view-naive">По списку, для сравнения</button>
    </div>
    <button type="button" id="btn-recalc" class="btn">Пересчитать</button>
    <button type="button" id="btn-approve" class="btn primary">Утвердить план</button>
    <button type="button" id="btn-incident" class="btn danger" title="Машина сломалась, задерживается или точка не принимает товар">Форс-мажор</button>
    <button type="button" id="btn-qr" class="btn">QR водителя</button>
    <button type="button" id="btn-reset" class="btn">Сбросить демо</button>
  </div>
</header>

<section class="kpis" id="kpis" aria-label="Показатели плана"></section>

<main class="work">
  <aside class="panel" aria-label="Заказы">
    <div class="panel-head"><h2>Заказы</h2><span class="status">нажмите на заказ — покажу на карте</span></div>
    <div class="tab-body" id="tab-orders">
      <input type="search" id="order-search" placeholder="Найти магазин или улицу" aria-label="Поиск по заказам">
      <div class="scroll">
        <table class="grid" id="orders-table">
          <thead><tr><th title="Важная точка: приехать в течение часа после указанного времени">★</th><th>Получатель</th><th>Кг</th><th>Не раньше</th><th>Маш.</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Вкладки «Машины» и «Правила» и строка «почему машин столько» скрыты по решению автора (15 ноября):
         машины и правила приходят из CRM (1С), логисту на этом экране они не нужны; число машин видно в плитке
         «Количество транспорта». Разметка оставлена: расчёт, синхронизация экранов и проверки (tests/) ею пользуются.
         Вернуть на экран — убрать hidden и добавить вкладки. -->
    <div hidden>
      <table class="grid" id="vehicles-table">
        <thead><tr><th>На линии</th><th>Машина</th><th>Вместимость, кг</th><th>Загрузка</th></tr></thead>
        <tbody></tbody>
      </table>
      <button type="button" id="btn-add-vehicle" class="btn wide">Добавить машину</button>
      <form id="settings-form" class="settings"></form>
      <div id="fleet-note"></div>
    </div>
  </aside>

  <section class="map-wrap" aria-label="Карта маршрутов">
    <div id="map"></div>
    <p class="map-note" id="map-note"></p>
    <p class="map-flag" id="map-flag" hidden>Предложение — ещё не общий план</p>
  </section>

  <aside class="panel" aria-label="Маршруты">
    <div class="panel-head"><h2>Маршруты</h2><span id="status" class="status"></span></div>
    <div class="scroll">
      <!-- Чат с ИИ (js/chat.js) — вместо блоков «Что изменилось?», «А если…» и кнопки «Форс-мажор».
           Старый экран с этими блоками: index.html?old=1 (тогда заполняются #assistant, #whatif, #proposal). -->
      <div id="chat"></div>
      <div id="assistant"></div>
      <div id="feed" aria-live="polite"></div>
      <div id="whatif"></div>
      <div id="proposal"></div>
      <div id="incident"></div>
      <div id="problems"></div>
      <div id="routes"></div>
    </div>
  </aside>
</main>

<div class="overlay" id="qr-overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="qr-title">
    <h2 id="qr-title">Страница водителя</h2>
    <div id="qr-code" class="qr"></div>
    <a id="qr-link" href="driver.html" target="_blank" rel="noopener">driver.html</a>
    <p id="qr-note"></p>
    <button type="button" id="qr-close" class="btn">Закрыть</button>
  </div>
</div>
<div class="overlay" id="fm-overlay" hidden>
  <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="fm-title">
    <h2 id="fm-title">Что-то пошло не так</h2>
    <div id="fm-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
<script src="vendor/supabase-js-2.118.0/supabase.js"></script>
<script src="vendor/qrcode-generator-1.4.4/qrcode.js"></script>
<script src="js/config.js?v=36"></script>
<script src="js/store.js?v=36"></script>
<script src="js/settings.js?v=36"></script>
<script src="js/data.js?v=36"></script>
<script src="js/roads.js?v=36"></script>
<script src="js/base-plan.js?v=36"></script>
<script src="js/tomorrow-plan.js?v=36"></script>
<script src="js/base-roads.js?v=36"></script>
<script src="js/solver.js?v=36"></script>
<script src="js/fleet.js?v=36"></script>
<script src="js/replan.js?v=36"></script>
<script src="js/changes.js?v=36"></script>
<script src="js/proposal.js?v=36"></script>
<script src="js/assistant.js?v=36"></script>
<script src="js/chat.js?v=36"></script>
<script src="js/map.js?v=36"></script>
<script src="js/app.js?v=36"></script>
</body>
</html>
